<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cross-backend parity (W7 / §12.1)</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #15171c;
        color: #e6e6e6;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      h1 { font-size: 14px; font-weight: 600; margin: 0; opacity: 0.7; }
      .pair { display: flex; gap: 12px; }
      figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
      figcaption { opacity: 0.6; font-size: 12px; }
      canvas {
        width: 384px;
        height: 384px;
        border: 1px solid #333;
        background: #000;
      }
      #status {
        max-width: 920px;
        padding: 8px 12px;
        border-radius: 6px;
        text-align: center;
        word-break: break-word;
      }
      #status.run { background: #2b2f3a; }
      #status.pass { background: #143a1e; color: #9ff0b5; }
      #status.fail { background: #3a1414; color: #ff9b9b; }
    </style>
  </head>
  <body>
    <h1>schematic-renderer-webgpu · cross-backend parity (W7 / §12.1 torture)</h1>
    <div class="pair">
      <!-- #c is the WebGPU canvas (the Playwright runner screenshots #c). -->
      <figure><canvas id="c"></canvas><figcaption>WebGPU</figcaption></figure>
      <figure><canvas id="cgl"></canvas><figcaption>WebGL2 (forced)</figcaption></figure>
    </div>
    <div id="status" class="run">loading…</div>
    <script type="module" src="./dist/crossbackend.js"></script>
  </body>
</html>
